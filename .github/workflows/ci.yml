name: BankGuard CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint Next.js
        run: npm run lint
        
      - name: Build Next.js
        run: npm run build

  backend:
    name: Build Backend (AWS SAM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build API
        run: |
          cd api
          sam build

      - name: Build Compliance Auditor
        run: |
          cd compliance-auditor
          sam build

      - name: Build Fraud Monitor
        run: |
          cd fraud-monitor
          sam build

